<title>Control de Tapas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0ee;
    --surface:#ffffff;
    --surface-2:#f4f5f4;
    --border:#d8dbd8;
    --border-strong:#c2c6c2;
    --text:#1a1e1f;
    --text-muted:#5c6567;
    --text-faint:#8a9294;
    --accent:#b4632b;
    --accent-strong:#8f4d22;
    --accent-soft:#f3e3d4;
    --accent-contrast:#fff8f2;
    --ok:#2e7d4f; --ok-soft:#dceee2; --ok-strong:#1f5c39;
    --info:#2b6cb0; --info-soft:#dce8f5; --info-strong:#1f4e82;
    --danger:#b23a2e; --danger-soft:#f5dbd6; --danger-strong:#832a20; --danger-on:#fff8f6;
    --neutral-chip:#e2e4e2; --neutral-chip-text:#565d5e;
    --shadow: 0 1px 2px rgba(20,24,20,.06), 0 4px 14px rgba(20,24,20,.05);
    --radius: 10px;
    --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171a; --surface:#1b1f22; --surface-2:#20262a;
      --border:#2b3236; --border-strong:#3a4247;
      --text:#e9ecec; --text-muted:#a2acae; --text-faint:#727d80;
      --accent:#d69a5b; --accent-strong:#e6ac72; --accent-soft:#3a2a1c; --accent-contrast:#1a1108;
      --ok:#5fbd8b; --ok-soft:#173626; --ok-strong:#8fd6ae;
      --info:#6fa8dc; --info-soft:#18293b; --info-strong:#9cc4ea;
      --danger:#e2786a; --danger-soft:#3a201c; --danger-strong:#f0a196; --danger-on:#2a0f0b;
      --neutral-chip:#282e31; --neutral-chip-text:#a2acae;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171a; --surface:#1b1f22; --surface-2:#20262a;
    --border:#2b3236; --border-strong:#3a4247;
    --text:#e9ecec; --text-muted:#a2acae; --text-faint:#727d80;
    --accent:#d69a5b; --accent-strong:#e6ac72; --accent-soft:#3a2a1c; --accent-contrast:#1a1108;
    --ok:#5fbd8b; --ok-soft:#173626; --ok-strong:#8fd6ae;
    --info:#6fa8dc; --info-soft:#18293b; --info-strong:#9cc4ea;
    --danger:#e2786a; --danger-soft:#3a201c; --danger-strong:#f0a196; --danger-on:#2a0f0b;
    --neutral-chip:#282e31; --neutral-chip-text:#a2acae;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100vh; overflow-x:hidden;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:800; letter-spacing:.01em; text-wrap:balance; margin:0;}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}
  .mono{font-family:var(--font-mono);}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---------- layout shells ---------- */
  .center-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .brand-mark svg{width:19px;height:19px;}
  .brand-name{font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:.01em;}

  /* language toggle */
  .lang-toggle{display:inline-flex; gap:3px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; flex-shrink:0;}
  .lang-toggle button{border:none; background:transparent; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--text-muted);}
  .lang-toggle button.active{background:var(--accent); color:var(--accent-contrast);}

  /* topbar */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; flex-wrap:wrap;
  }
  .topbar .who{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .who-chip{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 6px 5px 12px;}
  .who-chip .name{font-weight:600; font-size:13px;}
  .who-chip .role{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}
  .icon-btn{background:transparent; border:1px solid var(--border); border-radius:999px; width:32px;height:32px; display:flex;align-items:center;justify-content:center; color:var(--text-muted); flex-shrink:0;}
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}
  .save-indicator{font-size:11.5px; color:var(--text-faint); display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .save-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
  .save-indicator.ok .save-dot{background:var(--ok);}
  .save-indicator.busy .save-dot{background:var(--info); animation:pulse 1s infinite;}
  .save-indicator.err .save-dot{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* tabs (admin nav) */
  .tabbar{display:flex; gap:2px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto;}
  .tabbar button{background:none;border:none;padding:11px 14px;font-weight:600;font-size:13.5px;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;}
  .tabbar button.active{color:var(--accent-strong); border-bottom-color:var(--accent);}
  .tabbar button:hover{color:var(--text);}

  .main{flex:1; width:100%; max-width:980px; margin:0 auto; padding:20px 16px 80px; display:flex; flex-direction:column; gap:18px;}
  .main.wide{max-width:1180px;}

  /* buttons */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); padding:10px 16px; font-weight:600; font-size:14px; color:var(--text); transition:filter .1s;}
  .btn:hover{filter:brightness(0.97);}
  :root[data-theme="dark"] .btn:hover, @media (prefers-color-scheme:dark){.btn:hover{filter:brightness(1.15);}}
  .btn-primary{background:var(--accent); border-color:var(--accent-strong); color:var(--accent-contrast);}
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-danger{background:var(--danger); border-color:var(--danger-strong); color:var(--danger-on);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted);}
  .btn-ghost:hover{background:var(--surface-2); color:var(--text);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px; font-size:13px; border-radius:7px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap;}

  /* forms */
  label.field{display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:600; color:var(--text-muted);}
  label.field span.hint{font-weight:400; color:var(--text-faint); font-size:12px;}
  input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],select,textarea{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; padding:9px 11px; color:var(--text); width:100%;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  textarea{resize:vertical; min-height:64px; font-family:var(--font-body);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:640px){ .grid2,.grid3{grid-template-columns:1fr;} }
  .check-row{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600;}
  .check-row input{width:18px;height:18px;}
  fieldset{border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px 16px; margin:0;}
  legend{font-family:var(--font-display); font-weight:700; font-size:15px; padding:0 6px;}

  /* section header */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .section-head h2{font-size:22px;}
  .eyebrow{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-strong);}

  /* stat row */
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:720px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .stat .num{font-family:var(--font-mono); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1;}
  .stat .lbl{font-size:12px; color:var(--text-muted); margin-top:5px;}
  .stat.danger .num{color:var(--danger);}
  .stat.info .num{color:var(--info);}

  /* chips */
  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
  .chip-pendiente{background:var(--neutral-chip); color:var(--neutral-chip-text);}
  .chip-en_progreso{background:var(--info-soft); color:var(--info-strong);}
  .chip-completado{background:var(--ok-soft); color:var(--ok-strong);}
  .chip-con_falla{background:var(--danger-soft); color:var(--danger-strong);}
  .chip-role{background:var(--accent-soft); color:var(--accent-strong);}

  /* tapa card */
  .tapa-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:10px; cursor:pointer;}
  .tapa-card:hover{border-color:var(--border-strong);}
  .tapa-card.falla{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset, var(--shadow);}
  .tapa-card-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .tapa-card-top .cliente{font-weight:700; font-size:15.5px;}
  .tapa-card-top .tapa-label{font-size:12.5px; color:var(--text-muted);}
  .tapa-meta{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--text-muted);}
  .tapa-meta b{color:var(--text); font-weight:600;}

  /* stepper */
  .stepper{display:flex; align-items:center; gap:2px; overflow-x:auto; padding:2px 0;}
  .step{display:flex; align-items:center; gap:2px; flex-shrink:0;}
  .step .dot{width:11px;height:11px;border-radius:50%; border:2px solid var(--border-strong); background:var(--surface); flex-shrink:0;}
  .step.completado .dot{background:var(--ok); border-color:var(--ok);}
  .step.en_progreso .dot{background:var(--info); border-color:var(--info);}
  .step.con_falla .dot{background:var(--danger); border-color:var(--danger);}
  .step .lbl{font-size:10.5px; color:var(--text-faint); margin:0 6px 0 4px; white-space:nowrap;}
  .step.completado .lbl,.step.en_progreso .lbl,.step.con_falla .lbl{color:var(--text-muted);}
  .step-line{width:16px;height:2px;background:var(--border-strong); flex-shrink:0;}
  .step-line.done{background:var(--ok);}

  /* task list (worker) */
  .task-item{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:8px; cursor:pointer;}
  .task-item.falla{border-color:var(--danger);}
  .task-item .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .task-item .cliente{font-weight:700; font-size:16.5px;}
  .task-item .sub{font-size:13px; color:var(--text-muted);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--text-muted);}
  .empty-state .glyph{font-size:34px; margin-bottom:8px;}

  /* detail page */
  .detail-head{display:flex; flex-direction:column; gap:10px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--text-muted); background:none; border:none; padding:0; align-self:flex-start;}
  .back-link:hover{color:var(--text);}
  .spec-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 18px; font-size:13.5px;}
  .spec-grid .k{color:var(--text-faint); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
  .spec-grid .v{font-weight:600;}

  .timeline{display:flex; flex-direction:column; gap:10px;}
  .tl-stage{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden;}
  .tl-stage.current{border-color:var(--accent-strong); box-shadow:0 0 0 1px var(--accent-strong) inset;}
  .tl-stage.falla{border-color:var(--danger);}
  .tl-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:var(--surface-2);}
  .tl-head .left{display:flex; align-items:center; gap:10px;}
  .tl-head .idx{font-family:var(--font-mono); font-size:12px; color:var(--text-faint); width:16px;}
  .tl-head h4{font-size:14.5px; font-weight:700;}
  .tl-body{padding:14px; display:flex; flex-direction:column; gap:12px;}
  .tl-people{font-size:12px; color:var(--text-muted);}
  .comment{background:var(--surface-2); border-radius:8px; padding:9px 11px; font-size:13px;}
  .comment .meta{font-size:11px; color:var(--text-faint); margin-bottom:3px;}
  .photo-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .photo-thumb{width:74px;height:74px; border-radius:7px; object-fit:cover; border:1px solid var(--border); cursor:pointer;}
  .falla-box{background:var(--danger-soft); border:1px solid var(--danger); border-radius:8px; padding:10px 12px; font-size:13px;}
  .falla-box b{color:var(--danger-strong);}

  .lightbox{position:fixed; inset:0; background:rgba(10,12,10,.85); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px;}

  .pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:230px; margin:0 auto;}
  .pin-pad button{padding:14px 0; font-size:19px; font-weight:600; border-radius:9px; background:var(--surface-2); border:1px solid var(--border);}
  .pin-dots{display:flex; gap:10px; justify-content:center; margin:6px 0 2px;}
  .pin-dot{width:13px;height:13px;border-radius:50%; border:2px solid var(--border-strong);}
  .pin-dot.filled{background:var(--accent); border-color:var(--accent);}

  .worker-pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px;}
  .worker-pick button{display:flex; flex-direction:column; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px;}
  .worker-pick button:hover{border-color:var(--accent);}
  .avatar{width:44px;height:44px;border-radius:50%; background:var(--accent-soft); color:var(--accent-strong); display:flex;align-items:center;justify-content:center; font-weight:700; font-size:16px; font-family:var(--font-display);}
  .worker-pick .nm{font-weight:600; font-size:13.5px; text-align:center;}
  .worker-pick .rl{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}

  .banner{border-radius:8px; padding:10px 13px; font-size:13px; display:flex; gap:8px; align-items:flex-start;}
  .banner-danger{background:var(--danger-soft); color:var(--danger-strong); border:1px solid var(--danger);}
  .banner-info{background:var(--info-soft); color:var(--info-strong); border:1px solid var(--info);}
  .banner-ok{background:var(--ok-soft); color:var(--ok-strong); border:1px solid var(--ok);}

  table.roster{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.roster th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border);}
  table.roster td{padding:9px 10px; border-bottom:1px solid var(--border);}
  table.roster tr:last-child td{border-bottom:none;}

  .tapa-repeat{border:1px dashed var(--border-strong); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:12px; position:relative;}
  .tapa-repeat .rm{position:absolute; top:10px; right:10px;}

  .overlay{position:fixed; inset:0; background:rgba(10,12,10,.4); z-index:90; display:flex; align-items:flex-end; justify-content:center;}
  @media (min-width:640px){ .overlay{align-items:center;} }
  .sheet{background:var(--surface); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:14px 14px 0 0; padding:18px; display:flex; flex-direction:column; gap:12px;}
  @media (min-width:640px){ .sheet{border-radius:14px;} }

  .footnote{font-size:11.5px; color:var(--text-faint); line-height:1.5;}

  /* preview-as-role banner */
  .preview-banner{background:var(--accent-soft); border-bottom:2px solid var(--accent); color:var(--accent-strong); padding:9px 16px; font-size:13px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:sticky; top:53px; z-index:19;}
  .preview-banner b{color:inherit;}
  .photo-hint{font-size:12px; color:var(--text-faint); display:flex; align-items:center; gap:5px;}
</style>

  var locale = 'es';
  try{ var storedLoc = localStorage.getItem('cdt_locale'); if(storedLoc==='es'||storedLoc==='en') locale = storedLoc; }catch(e){}
  function tr(key){
    var d = TR[locale] || TR.es;
    if(d[key]!==undefined) return d[key];
    if(TR.es[key]!==undefined) return TR.es[key];
    return key;
  }
  function trf(key, vars){
    var s = tr(key);
    if(vars){ Object.keys(vars).forEach(function(k){ s = s.split('{'+k+'}').join(String(vars[k])); }); }
    return s;
  }

  /* ============ constants ============ */
  var STAGE_KEYS = ['material','templado','corte','fabricacion','pulido','instalacion','aprobacion'];
  var STAGE_ROLE = {material:'admin', templado:'templero', corte:'cortador', fabricacion:'fabricador', pulido:'polichador', instalacion:'instalador', aprobacion:'instalador'};
  var STAGES = STAGE_KEYS.map(function(k){ return {key:k, role:STAGE_ROLE[k]}; });
  var ROLE_KEYS = ['admin','encargado','templero','cortador','fabricador','polichador','instalador'];
  var FALLA_KEYS = ['chip','quebrado','medida','pulido','veta','hueco','otro'];
  var PERFIL_KEYS = ['eased','bullnose','bullnose_doble','bevel','ogee','waterfall','otro'];
  var SINK_KEYS = ['undermount','topmount','farmhouse','otro'];
  var MATERIAL_KEYS = ['granito','marmol','cuarzo','cuarcita','otro'];
  var AMBIENTE_KEYS = ['cocina','bano_principal','bano_secundario','isla','bar','lavanderia','otro'];

  function roleLabel(r){ return tr('role.'+r); }
  function stageInfo(k){ return STAGES.filter(function(s){return s.key===k;})[0]; }
  function stageLabel(k){ return tr('stage.'+k+'.label'); }
  function stageShort(k){ return tr('stage.'+k+'.short'); }
  function materialLabel(k){ return k ? tr('material.'+k) : '—'; }
  function perfilLabel(k){ return k ? tr('perfil.'+k) : '—'; }
  function sinkLabel(k){ return k ? tr('sink.'+k) : '—'; }
  function ambienteLabel(k){ return k ? tr('ambiente.'+k) : '—'; }
  function fallaTipoLabel(k){ if(!k) return '—'; if(k==='rechazado_cliente') return tr('falla.rechazado_cliente'); return FALLA_KEYS.indexOf(k)>=0 ? tr('falla.'+k) : k; }
  function espesorLabel(k){ return k==='3cm' ? '3 cm' : '2 cm'; }

  /* ============ utils ============ */
  function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
  function esc(s){ s=(s===undefined||s===null)?'':String(s); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function nowISO(){ return new Date().toISOString(); }
  var MESES = { es:['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'] };
  function fmtDate(iso){ if(!iso) return '—'; var p=iso.split('-'); if(p.length<3) return iso; var meses=MESES[locale]||MESES.es; return parseInt(p[2],10)+' '+meses[parseInt(p[1],10)-1]+' '+p[0]; }
  function fmtDateTime(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return iso; var meses=MESES[locale]||MESES.es; return d.getDate()+' '+meses[d.getMonth()]+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function daysUntil(iso){ if(!iso) return null; var t=new Date(todayISO()+'T00:00:00'); var d=new Date(iso+'T00:00:00'); return Math.round((d-t)/86400000); }
  function unitSlab(n){ return n===1 ? tr('unit.slab') : tr('unit.slabs'); }
  function dateRelativeSuffix(iso){
    var d = daysUntil(iso);
    if(d===null) return '';
    if(d===0) return ' '+tr('card.today');
    if(d>0) return ' '+trf('card.inDays',{n:d});
    return ' '+tr('card.overdue');
  }
  function relevantDateForStage(tapa, stageKey){
    if(stageKey==='templado') return tapa.fechaTemplado;
    if(stageKey==='corte' || stageKey==='fabricacion') return tapa.fechaInicioFabricacion;
    if(stageKey==='instalacion') return tapa.fechaInstalacion;
    return null;
  }

  /* ============ state ============ */
  function emptyState(){
    return { version:1, workers:[], clientes:[], tapas:[] };
  }
  var state = emptyState(); // replaced by the real shared state once loadFromServer() resolves

  var session = null;
  try{ var raw=localStorage.getItem('cdt_session'); if(raw) session=JSON.parse(raw); }catch(e){}

  var route = {name:'home', params:{}};
  var overlayNode = null; // {name, params}
  var saveStatus = 'ok'; // ok | busy | err
  var previewWorkerId = null, previewPriorLocale = null;

  function nav(name, params){ route={name:name, params:params||{}}; closeOverlay(); render(); window.scrollTo(0,0); }
  function openOverlay(name, params){ overlayNode={name:name, params:params||{}}; renderOverlay(); }
  function closeOverlay(){ overlayNode=null; renderOverlay(); }

  function currentWorker(){
    if(!session) return null;
    return state.workers.filter(function(w){ return w.id===session.workerId; })[0] || null;
  }

  /* ============ persistence (Netlify Function + Blobs, no Claude account needed) ============ */
  var STATE_API = '/api/state';
  var serverVersion = 0;      // concurrency counter for the stored document (NOT state.version, the app's own schema version)
  var saveInFlight = false;
  var initialLoadDone = false;

  function isFieldFocused(){
    var el = document.activeElement;
    return !!(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT'));
  }

  function loadFromServer(){
    return fetch(STATE_API).then(function(r){ return r.json(); }).then(function(doc){
      state = (doc && doc.state) || emptyState();
      serverVersion = (doc && doc.version) || 1;
      initialLoadDone = true;
      setSaveStatus('ok');
    }).catch(function(err){
      console.error('No se pudo cargar el estado', err);
      initialLoadDone = true;
      setSaveStatus('err');
    });
  }

  var pendingSave = false, saveTimer = null;
  function scheduleSave(){
    pendingSave = true;
    setSaveStatus('busy');
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ doSave(3); }, 260);
  }
  function setSaveStatus(s){ saveStatus=s; var el=document.getElementById('save-indicator'); if(el) el.outerHTML=renderSaveIndicator(); }
  function renderSaveIndicator(){
    var label = saveStatus==='busy' ? (locale==='en'?'Saving…':'Guardando…') : saveStatus==='err' ? (locale==='en'?'Offline':'Sin conexión') : (locale==='en'?'Saved':'Guardado');
    return '<span id="save-indicator" class="save-indicator '+saveStatus+'"><span class="save-dot"></span>'+label+'</span>';
  }
  function doSave(attemptsLeft){
    if(!pendingSave) return;
    pendingSave = false;
    saveInFlight = true;
    fetch(STATE_API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ state: state, baseVersion: serverVersion })
    }).then(function(r){
      return r.json().then(function(data){ return {status:r.status, data:data}; });
    }).then(function(res){
      if(res.status===200){
        serverVersion = res.data.version;
        saveInFlight = false;
        setSaveStatus('ok');
        return;
      }
      if(res.status===409 && attemptsLeft>0){
        /* Someone else saved first. Rebase onto their version and retry with our
           local state — our own action already reflects in this device's UI, so
           we keep it rather than silently discarding it. */
        serverVersion = res.data.version;
        saveInFlight = false;
        pendingSave = true;
        doSave(attemptsLeft-1);
        return;
      }
      saveInFlight = false;
      setSaveStatus('err');
    }).catch(function(err){
      console.error(err);
      saveInFlight = false;
      setSaveStatus('err');
    });
  }

  /* pick up changes saved from other devices */
  var POLL_MS = 4000;
  function pollState(){
    if(!initialLoadDone || pendingSave || saveInFlight || isFieldFocused()) return;
    fetch(STATE_API).then(function(r){ return r.json(); }).then(function(doc){
      if(doc && typeof doc.version==='number' && doc.version!==serverVersion){
        state = doc.state || emptyState();
        serverVersion = doc.version;
        render();
      }
      setSaveStatus('ok');
    }).catch(function(){ setSaveStatus('err'); });
  }

  function mutate(fn){
    fn(state);

    scheduleSave();
  }

  /* ============ image compression ============ */
  function compressImage(file){
    return new Promise(function(resolve, reject){
      if(!file || !file.type || file.type.indexOf('image/')!==0){ reject(new Error('not an image')); return; }
      var img = new Image();
      var reader = new FileReader();
      reader.onload = function(e){
        img.onload = function(){
          var maxDim = 720;
          var w=img.width, h=img.height;
          var scale = Math.min(1, maxDim/Math.max(w,h));
          var cw = Math.round(w*scale), ch = Math.round(h*scale);
          var canvas = document.createElement('canvas');
          canvas.width=cw; canvas.height=ch;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,cw,ch);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.55);
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function approxStateSizeKB(){
    try{ return Math.round(JSON.stringify(state).length/1024); }catch(e){ return 0; }

  /* ============ WORKER ============ */
  function screenWorker(w, isPreview){
    if(route.name==='tapa-detalle') return topbar(w, isPreview) + (isPreview?previewBanner(w):'') + '<div class="main">' + tapaDetalle(route.params.tapaId, false, w) + '</div>';
    var tasks = tasksForWorker(w);
    var conFalla = tasks.filter(tapaHasFalla);
    return topbar(w, isPreview) + (isPreview?previewBanner(w):'') + '<div class="main">' +
      '<div class="section-head"><div><span class="eyebrow">'+esc(roleLabel(w.rol))+'</span><h2>'+esc(tr('worker.title'))+'</h2></div></div>' +
      (conFalla.length>0 ? '<div class="banner banner-danger">'+iconAlert()+' '+esc(trf('worker.fallaBanner',{n:conFalla.length, unit:unitSlab(conFalla.length)}))+'</div>' : '') +
      (tasks.length===0 ? emptyState('✅',tr('worker.empty')) :
        '<div style="display:flex; flex-direction:column; gap:10px;">' + tasks.map(function(t){ return workerTaskItem(t,w); }).join('') + '</div>') +
    '</div>';

  function workerTaskItem(t,w){
    var c = clienteById(t.clienteId);
    var cur = currentStageKey(t);
    var etapa = t.etapas[cur];
    var relDate = relevantDateForStage(t, cur);
    var overdue = relDate && daysUntil(relDate)<0 && etapa.estado!=='completado';
    return '<div class="task-item'+(etapa.estado==='con_falla'?' falla':'')+'" data-action="open-tapa" data-id="'+t.id+'">' +
      '<div class="top"><div><div class="cliente">'+esc(c?c.nombre:'—')+'</div><div class="sub">'+esc(t.etiqueta)+'</div></div>' +
      '<span class="chip chip-'+etapa.estado+'">'+(etapa.estado==='con_falla'?iconAlert()+' '+esc(tr('task.falla')):etapa.estado==='en_progreso'?esc(tr('task.progress')):esc(tr('task.pending')))+'</span></div>' +
      '<div class="tapa-meta">' +
        '<span><b>'+esc(tr('task.material'))+'</b> '+esc(materialLabel(t.material.tipo))+(t.material.color?' '+esc(t.material.color):'')+'</span>' +
        (relDate?'<span'+(overdue?' style="color:var(--danger); font-weight:600;"':'')+'><b>'+esc(tr('task.scheduledFor'))+'</b> '+fmtDate(relDate)+dateRelativeSuffix(relDate)+'</span>':'') +
      '</div>' +
    '</div>';
  }

        '<div class="detail-head"><div class="section-head"><div><span class="eyebrow">'+esc(c?c.nombre:'')+'</span><h2>'+esc(t.etiqueta)+'</h2></div></div></div>' +

  function tlStage(t, s, idx, w, isAdminView){
    var etapa = t.etapas[s.key];
    var isCurrent = currentStageKey(t)===s.key;
    var canAct = canActOnStage(w, t, s.key) && isCurrent;
    var cls = 'tl-stage' + (isCurrent?' current':'') + (etapa.estado==='con_falla'?' falla':'');
    return '<div class="'+cls+'">' +
      '<div class="tl-head"><div class="left"><span class="idx mono">'+(idx+1)+'</span><h4>'+esc(stageLabel(s.key))+'</h4></div>' +
        '<span class="chip chip-'+etapa.estado+'">'+esc(tr('stage.'+etapa.estado))+'</span></div>' +
      '<div class="tl-body">' +
        (etapa.encargadoId||etapa.inicio ? '<div class="tl-people">' + (etapa.encargadoId?(esc(tr('stage.assignedTo'))+' <b>'+esc(workerById(etapa.encargadoId)?workerById(etapa.encargadoId).nombre:'—')+'</b> · '):'') + (etapa.inicio?(esc(tr('stage.started'))+' '+fmtDateTime(etapa.inicio)):'') + (etapa.fin?(' · '+esc(tr('stage.finished'))+' '+fmtDateTime(etapa.fin)):'') + '</div>' : '') +
        (etapa.estado==='con_falla' && etapa.falla ? fallaBox(etapa.falla) : '') +
        (etapa.comentarios.length ? '<div style="display:flex;flex-direction:column;gap:6px;">' + etapa.comentarios.map(function(cm){ return '<div class="comment"><div class="meta">'+esc(cm.autor)+' · '+fmtDateTime(cm.fecha)+'</div>'+esc(cm.texto)+'</div>'; }).join('') + '</div>' : '') +
        (etapa.fotos.length ? '<div class="photo-grid">' + etapa.fotos.map(function(f,fi){ return '<img class="photo-thumb" src="'+f.dataUrl+'" data-action="view-photo" data-tapa="'+t.id+'" data-stage="'+s.key+'" data-idx="'+fi+'">'; }).join('') + '</div>' : '') +
        (canAct ? stageActionPanel(t, s, etapa, w) : (isAdminView && etapa.estado==='completado' ? '<button class="btn btn-sm btn-ghost" data-action="reopen-stage" data-tapa="'+t.id+'" data-stage="'+s.key+'">'+esc(tr('stage.reopen'))+'</button>' : '')) +
      '</div>' +
    '</div>';
  }
  function fallaBox(f){
    return '<div class="falla-box">' + iconAlert() + ' <b>'+esc(fallaTipoLabel(f.tipo))+'</b> — '+esc(tr('stage.reportedBy'))+' '+esc(f.reportadoPor)+' · '+fmtDateTime(f.fecha)+
      (f.descripcion?('<br>'+esc(f.descripcion)):'') + '</div>';
  }

  function stageActionPanel(t, s, etapa, w){
    var key = s.key;
    if(etapa.estado==='pendiente'){
      return '<div class="btn-row">' +
        '<button class="btn btn-primary btn-sm" data-action="stage-start" data-tapa="'+t.id+'" data-stage="'+key+'">'+esc(tr('stage.start'))+'</button>' +
      '</div>';
    }
    if(etapa.estado==='con_falla'){
      return '<div class="btn-row">' +
        '<button class="btn btn-sm" data-action="stage-retry" data-tapa="'+t.id+'" data-stage="'+key+'">'+esc(tr('stage.retry'))+'</button>' +
        '<button class="btn btn-primary btn-sm" data-action="stage-resolve" data-tapa="'+t.id+'" data-stage="'+key+'">'+esc(tr('stage.resolve'))+'</button>' +
      '</div>';
    }
    // en_progreso
    var extra = '';
    if(key==='material'){
      extra = '<div class="grid2">' +
        field(tr('field.materialSerial'),'text','materialSerial',tr('field.materialSerialPh'),{value:t.material.serial}) +
        field(tr('field.materialUbicacion'),'text','materialUbicacion',tr('field.materialUbicacionPh'),{value:t.material.ubicacion}) +
      '</div>';
    }
    if(key==='templado'){
      extra = field(tr('stage.measuresLabel'),'text','medidasFinales',tr('stage.measuresPh'),{value:t.medidasFinales});
      if(t.backsplash){
        extra += field(tr('field.backsplashMedida'),'text','backsplashMedida',tr('field.backsplashMedidaPh'),{value:t.backsplashMedida});
      }
    }
    if(key==='aprobacion'){
      return '' +
        '<form data-form="aprobacion" data-tapa="'+t.id+'">' +
          '<fieldset><legend>'+esc(tr('approval.legend'))+'</legend><div style="display:flex; flex-direction:column; gap:10px;">' +
            radioRow('resultado',[['aprobado',tr('approval.approved')],['aprobado_obs',tr('approval.approvedObs')],['rechazado',tr('approval.rejected')]]) +
            textareaField(tr('approval.comment'),'comentario',tr('approval.commentPh')) +
            '<button class="btn btn-primary btn-sm" type="submit" style="align-self:flex-start;">'+esc(tr('approval.save'))+'</button>' +
          '</div></fieldset>' +
        '</form>';
    }
    return '' +
      '<form data-form="stage-comment" data-tapa="'+t.id+'" data-stage="'+key+'" style="display:flex; flex-direction:column; gap:10px;">' +
        extra +
        textareaField(tr('stage.addComment'),'comentario',tr('stage.commentPh')) +
        '<div class="btn-row" style="align-items:center;">' +
          '<label class="btn btn-sm" style="cursor:pointer;">'+iconCamera()+' '+esc(tr('stage.photo'))+'<input type="file" accept="image/*" capture="environment" data-photo-input data-tapa="'+t.id+'" data-stage="'+key+'" style="display:none;"></label>' +
          '<button class="btn btn-sm" type="submit">'+esc(tr('stage.saveComment'))+'</button>' +
          '<span style="flex:1"></span>' +
          '<button type="button" class="btn btn-danger btn-sm" data-action="open-falla" data-tapa="'+t.id+'" data-stage="'+key+'">'+esc(tr('stage.reportFalla'))+'</button>' +
          '<button type="button" class="btn btn-primary btn-sm" data-action="stage-complete" data-tapa="'+t.id+'" data-stage="'+key+'">'+esc(tr('stage.complete'))+'</button>' +
        '</div>' +
        (etapa.fotos.length===0 ? '<div class="photo-hint">'+esc(tr('stage.photoHint'))+'</div>' : '') +
      '</form>';
  }
  function radioRow(name, opts){
    return '<div class="btn-row">' + opts.map(function(o){ return '<label class="check-row" style="background:var(--surface-2); padding:7px 12px; border-radius:8px; border:1px solid var(--border);"><input type="radio" name="'+name+'" value="'+o[0]+'" required> '+esc(o[1])+'</label>'; }).join('') + '</div>';
  }

        '<form data-form="falla" data-tapa="'+overlayNode.params.tapaId+'" data-stage="'+overlayNode.params.stage+'" style="display:flex; flex-direction:column; gap:12px;">' +
          selectField(tr('falla.type'),'tipo', keyOptions(FALLA_KEYS, fallaTipoLabel)) +
          textareaField(tr('falla.desc'),'descripcion',tr('falla.descPh')) +
          '<label class="btn" style="cursor:pointer; align-self:flex-start;">'+iconCamera()+' '+esc(tr('falla.attach'))+'<input type="file" accept="image/*" capture="environment" data-photo-input-falla style="display:none;"></label>' +
          '<div id="falla-photo-preview"></div>' +
          '<div class="btn-row"><button type="button" class="btn" data-action="close-overlay">'+esc(tr('falla.cancel'))+'</button><button type="submit" class="btn btn-danger">'+esc(tr('falla.submit'))+'</button></div>' +
        '</form>' +
      '</div></div>';
    } else if(overlayNode.name==='photo'){
      var t = state.tapas.filter(function(x){return x.id===overlayNode.params.tapaId;})[0];
      var foto = t.etapas[overlayNode.params.stage].fotos[overlayNode.params.idx];
      root.innerHTML = '<div class="lightbox" data-action="close-overlay-bg"><img src="'+(foto?foto.dataUrl:'')+'"></div>';
    }
    bindGlobalHandlers(root);
  }
  var fallaPhotoData = null;

  /* ============ event binding ============ */
  function bindGlobalHandlers(root){
    root.querySelectorAll('[data-action]').forEach(function(el){
      el.onclick = function(ev){ handleAction(el.getAttribute('data-action'), el, ev); };
    });
    root.querySelectorAll('[data-form]').forEach(function(el){
      el.onsubmit = function(ev){ ev.preventDefault(); handleForm(el); };
    });
    root.querySelectorAll('[data-input="admin-search"]').forEach(function(el){
      el.oninput = function(){ adminSearch = el.value; render(); var i=document.querySelector('[data-input="admin-search"]'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } };
    });
    root.querySelectorAll('[data-photo-input]').forEach(function(el){
      el.onchange = function(){
        if(previewBlocked()){ el.value=''; return; }
        var file = el.files[0]; if(!file) return;
        var tapaId = el.getAttribute('data-tapa'), stage = el.getAttribute('data-stage');
        /* Attaching a photo re-renders the whole panel (mutate() -> render()), which would
           otherwise wipe anything the worker already typed (measurements, serial, comments)
           into the sibling form fields before they hit save. Snapshot those field values here
           and restore them into the freshly-rendered form once the photo is saved. */
        var formEl = el.closest('form');
        var preserved = formEl ? new FormData(formEl) : null;
        compressImage(file).then(function(dataUrl){
          mutate(function(st){
            var t = st.tapas.filter(function(x){return x.id===tapaId;})[0];
            t.etapas[stage].fotos.push({dataUrl:dataUrl, autor:currentWorker().nombre, fecha:nowISO()});
          });
          if(preserved){
            var freshForm = document.querySelector('form[data-form="stage-comment"][data-tapa="'+tapaId+'"][data-stage="'+stage+'"]');
            if(freshForm){
              preserved.forEach(function(value, key){
                var input = freshForm.querySelector('[name="'+key+'"]');
                if(input && input.type!=='file'){ input.value = value; }
              });
            }
          }
        }).catch(function(){ alert(tr('alert.photoFail')); });
      };
    });
    root.querySelectorAll('[data-photo-input-falla]').forEach(function(el){
      el.onchange = function(){
        if(previewBlocked()){ el.value=''; return; }
        var file = el.files[0]; if(!file) return;
        compressImage(file).then(function(dataUrl){
          fallaPhotoData = dataUrl;
          var prev = document.getElementById('falla-photo-preview');
          if(prev) prev.innerHTML = '<img class="photo-thumb" src="'+dataUrl+'">';
        }).catch(function(){ alert(tr('alert.photoFail')); });
      };
    });
  }

  function handleAction(action, el, ev){
    if(MUTATING_ACTIONS.indexOf(action)>=0 && previewBlocked()) return;
    if(action==='logout'){ session=null; try{localStorage.removeItem('cdt_session');}catch(e){} nav('home'); return; }
    if(action==='set-locale'){
      var newLoc = el.getAttribute('data-loc');
      locale = newLoc;
      try{ localStorage.setItem('cdt_locale', newLoc); }catch(e){}
      var cw = currentWorker();
      if(cw && !previewWorkerId){ mutate(function(st){ workerById2(st,cw.id).idioma = newLoc; }); } else { render(); }
      return;
    }
    if(action==='preview-worker'){
      var pid = el.getAttribute('data-id');
      var pw = workerById(pid);
      if(pw){
        previewWorkerId = pid;
        previewPriorLocale = locale;
        locale = pw.idioma || locale;
        route = {name:'home', params:{}};
        render();
      }
      return;
    }
    if(action==='exit-preview'){
      previewWorkerId = null;
      if(previewPriorLocale){ locale = previewPriorLocale; previewPriorLocale = null; }
      adminTab='equipo'; route={name:'admin',params:{}}; render();
      return;
    }
    if(action==='pick-worker'){ pinTargetId=el.getAttribute('data-id'); pinBuffer=''; pinError=false; route={name:'pin',params:{}}; render(); return; }
    if(action==='cancel-pin'){ pinTargetId=null; pinBuffer=''; render(); return; }
    if(action==='pin-digit'){
      if(pinBuffer.length>=4) return;
      pinBuffer += el.getAttribute('data-d');
      pinError=false;
      if(pinBuffer.length===4){ tryPinLogin(); }
      render();
      return;
    }
    if(action==='pin-back'){ pinBuffer = pinBuffer.slice(0,-1); render(); return; }
    if(action==='pin-clear'){ pinBuffer=''; render(); return; }
    if(action==='admin-tab'){ adminTab = el.getAttribute('data-tab'); route={name:'admin',params:{}}; render(); return; }
    if(action==='admin-filter'){ adminFilter = el.getAttribute('data-val'); render(); return; }
    if(action==='open-tapa'){
      var id = el.getAttribute('data-id');
      var w = previewWorkerId ? workerById(previewWorkerId) : currentWorker();
      if((w.rol==='admin' || w.rol==='encargado') && !previewWorkerId){ adminTab='tapa-detalle'; route={name:'admin',params:{tapaId:id}}; }
      else { route={name:'tapa-detalle',params:{tapaId:id}}; }
      render(); window.scrollTo(0,0); return;
    }
    if(action==='open-cliente'){ adminTab='cliente-detalle'; route={name:'admin',params:{clienteId:el.getAttribute('data-id')}}; render(); return; }
    if(action==='nav-home'){ route={name:'home',params:{}}; render(); return; }
    if(action==='add-tapa-block'){ readTapaBlocksFromDom(); newClienteTapas.push({}); render(); return; }
    if(action==='remove-tapa-block'){ var idx=parseInt(el.getAttribute('data-idx'),10); readTapaBlocksFromDom(); newClienteTapas.splice(idx,1); render(); return; }
    if(action==='reset-pin'){
      var id2 = el.getAttribute('data-id'); var np = prompt(tr('prompt.newPin'));
      if(np && /^[0-9]{4}$/.test(np)){ mutate(function(st){ workerById2(st,id2).pin=np; }); } else if(np!==null){ alert(tr('alert.pin4')); }
      return;
    }
    if(action==='toggle-worker'){
      var id3=el.getAttribute('data-id');
      var target=workerById(id3);
      if(target && target.rol==='admin' && target.activo){
        var otherActiveAdmins = state.workers.filter(function(w2){return w2.rol==='admin' && w2.activo && w2.id!==id3;}).length;
        if(otherActiveAdmins===0){ alert(tr('alert.lastAdmin')); return; }
      }
      mutate(function(st){ var w2=workerById2(st,id3); w2.activo=!w2.activo; });
      return;
    }
    if(action==='preview-worker'){ /* handled above */ return; }
    if(action==='stage-start'){ doStageStart(el); return; }
    if(action==='stage-complete'){ doStageComplete(el); return; }
    if(action==='stage-retry'){ doStageRetry(el); return; }
    if(action==='stage-resolve'){ doStageResolve(el); return; }
    if(action==='reopen-stage'){ doReopenStage(el); return; }
    if(action==='open-falla'){ fallaPhotoData=null; openOverlay('falla',{tapaId:el.getAttribute('data-tapa'), stage:el.getAttribute('data-stage')}); return; }
    if(action==='close-overlay'){ closeOverlay(); return; }
    if(action==='close-overlay-bg'){ if(!ev || el===ev.target){ closeOverlay(); } return; }
    if(action==='view-photo'){ openOverlay('photo',{tapaId:el.getAttribute('data-tapa'), stage:el.getAttribute('data-stage'), idx:parseInt(el.getAttribute('data-idx'),10)}); return; }
    if(action==='edit-tapa'){ editingTapaId = el.getAttribute('data-tapa'); render(); return; }
    if(action==='cancel-edit-tapa'){ editingTapaId = null; render(); return; }
    if(action==='delete-tapa'){
      var delId = el.getAttribute('data-tapa');
      if(!confirm(tr('confirm.deleteTapa'))) return;
      mutate(function(st){ st.tapas = st.tapas.filter(function(x){return x.id!==delId;}); });
      editingTapaId = null;
      adminTab='panel'; route={name:'admin',params:{}}; render();
      return;
    }
  }
  function workerById2(st,id){ return st.workers.filter(function(w){return w.id===id;})[0]; }

  function tryPinLogin(){
    var w = workerById(pinTargetId);
    if(w && w.pin===pinBuffer){
      session = {workerId:w.id};
      try{ localStorage.setItem('cdt_session', JSON.stringify(session)); }catch(e){}
      if(w.idioma){ locale = w.idioma; try{ localStorage.setItem('cdt_locale', locale); }catch(e){} }
      pinTargetId=null; pinBuffer='';
      route={name:'home',params:{}};
    } else {
      pinError = true; pinBuffer='';
    }
  }

  function readTapaBlocksFromDom(){
    var blocks = document.querySelectorAll('[data-tapa-idx]');
    var result = [];
    blocks.forEach(function(b){
      var idx = b.getAttribute('data-tapa-idx');
      function g(n){ var f=b.querySelector('[name="t'+idx+'_'+n+'"]'); return f?(f.type==='checkbox'?f.checked:f.value):undefined; }
      result.push({ etiqueta:g('etiqueta'), ambiente:g('ambiente'), materialTipo:g('materialTipo'), materialColor:g('materialColor'), espesor:g('espesor'), backsplash:g('backsplash'), perfil:g('perfil'), sink:g('sink'), sinkTipo:g('sinkTipo'), huecos:g('huecos'), fechaTemplado:g('fechaTemplado'), fechaFabricacion:g('fechaFabricacion'), fecha:g('fecha'), instalador:g('instalador'), notas:g('notas') });
    });
    newClienteTapas = result;
  }

  function handleForm(formEl){
    var kind = formEl.getAttribute('data-form');
    if(MUTATING_FORMS.indexOf(kind)>=0 && previewBlocked()) return;
    var fd = new FormData(formEl);
    if(kind==='bootstrap'){
      var nombre=fd.get('nombre'), pin=fd.get('pin'), pin2=fd.get('pin2');
      if(!/^[0-9]{4}$/.test(pin)){ alert(tr('alert.pin4')); return; }
      if(pin!==pin2){ alert(tr('alert.pinMatch')); return; }
      mutate(function(st){ st.workers.push({id:uid('w'), nombre:nombre, rol:'admin', pin:pin, idioma:locale, activo:true, creadoEn:nowISO()}); });
      var w = state.workers[state.workers.length-1];
      session={workerId:w.id}; try{localStorage.setItem('cdt_session', JSON.stringify(session));}catch(e){}
      route={name:'home',params:{}}; render();
      return;
    }
    if(kind==='nuevo-worker'){
      var nombre2=fd.get('nombre'), rol=fd.get('rol'), pin3=fd.get('pin'), idioma2=fd.get('idioma')||'es';
      if(!nombre2 || !/^[0-9]{4}$/.test(pin3)){ alert(tr('alert.nameAndPin')); return; }
      mutate(function(st){ st.workers.push({id:uid('w'), nombre:nombre2, rol:rol, pin:pin3, idioma:idioma2, activo:true, creadoEn:nowISO()}); });
      formEl.reset();
      return;
    }
    if(kind==='nuevo-cliente'){
      readTapaBlocksFromDom();
      var cn = fd.get('clienteNombre');
      if(!cn){ alert(tr('alert.clientName')); return; }
      var blocks = newClienteTapas.slice();
      mutate(function(st){
        var cliente = {id:uid('c'), nombre:cn, telefono:fd.get('clienteTelefono')||'', direccion:fd.get('clienteDireccion')||'', creadoEn:nowISO(), creadoPor:currentWorker().nombre};
        st.clientes.push(cliente);
        blocks.forEach(function(b, i){
          st.tapas.push({
            id:uid('t'), clienteId:cliente.id,
            etiqueta:b.etiqueta || trf('nuevo.tapaEyebrow',{n:i+1}),
            ambiente:b.ambiente||'', material:{tipo:b.materialTipo||'granito', color:b.materialColor||'', serial:'', ubicacion:''},
            espesor:b.espesor||'2cm', backsplash: !!b.backsplash, backsplashMedida:'', perfil:b.perfil||'', sink: !!b.sink, sinkTipo: b.sink? (b.sinkTipo||''):'',
            huecos: parseInt(b.huecos||0,10)||0,
            fechaTemplado:b.fechaTemplado||'', fechaInicioFabricacion:b.fechaFabricacion||'', fechaInstalacion:b.fecha||'', instaladorId:b.instalador||null,
            notas:b.notas||'', medidasFinales:'', creadoEn:nowISO(), etapas:newTapaEtapas()
          });
        });
      });
      newClienteTapas=[{}];
      adminTab='panel'; route={name:'admin',params:{}}; render();
      return;
    }
    if(kind==='editar-tapa'){
      var editTapaId = formEl.getAttribute('data-tapa');
      mutate(function(st){
        var t = st.tapas.filter(function(x){return x.id===editTapaId;})[0];
        if(!t) return;
        t.etiqueta = fd.get('etiqueta') || t.etiqueta;
        t.ambiente = fd.get('ambiente') || '';
        t.material.tipo = fd.get('materialTipo') || t.material.tipo;
        t.material.color = fd.get('materialColor') || '';
        t.material.serial = fd.get('materialSerial') || '';
        t.material.ubicacion = fd.get('materialUbicacion') || '';
        t.espesor = fd.get('espesor') || t.espesor;
        t.backsplash = !!fd.get('backsplash');
        t.backsplashMedida = t.backsplash ? (fd.get('backsplashMedida') || '') : '';
        t.perfil = fd.get('perfil') || '';
        t.sink = !!fd.get('sink');
        t.sinkTipo = t.sink ? (fd.get('sinkTipo') || '') : '';
        t.huecos = parseInt(fd.get('huecos') || 0, 10) || 0;
        t.medidasFinales = fd.get('medidasFinales') || '';
        t.fechaTemplado = fd.get('fechaTemplado') || '';
        t.fechaInicioFabricacion = fd.get('fechaFabricacion') || '';
        t.fechaInstalacion = fd.get('fecha') || t.fechaInstalacion;
        t.instaladorId = fd.get('instalador') || null;
        t.notas = fd.get('notas') || '';
      });
      editingTapaId = null;
      render();
      return;
    }
    if(kind==='stage-comment'){
      var tapaId=formEl.getAttribute('data-tapa'), stage=formEl.getAttribute('data-stage');
      mutate(function(st){
        var t = st.tapas.filter(function(x){return x.id===tapaId;})[0];
        applyStageExtras(t, stage, fd);
      });
      var ta = formEl.querySelector('textarea'); if(ta) ta.value='';
      return;
    }
    if(kind==='falla'){
      var tapaId2=formEl.getAttribute('data-tapa'), stage2=formEl.getAttribute('data-stage');
      var tipo=fd.get('tipo'), desc=fd.get('descripcion');
      mutate(function(st){
        var t = st.tapas.filter(function(x){return x.id===tapaId2;})[0];
        var f = {tipo:tipo, descripcion:desc||'', reportadoPor:currentWorker().nombre, fecha:nowISO(), resuelto:false};
        t.etapas[stage2].estado='con_falla';
        t.etapas[stage2].falla=f;
        if(fallaPhotoData){ t.etapas[stage2].fotos.push({dataUrl:fallaPhotoData, autor:currentWorker().nombre, fecha:nowISO()}); }
        t.fallas = t.fallas||[]; t.fallas.push(Object.assign({etapa:stage2}, f));
      });
      fallaPhotoData=null;
      closeOverlay();
      return;
    }
    if(kind==='aprobacion'){
      var tapaId3=formEl.getAttribute('data-tapa');
      var resultado=fd.get('resultado'), comentario2=fd.get('comentario');
      mutate(function(st){
        var t = st.tapas.filter(function(x){return x.id===tapaId3;})[0];
        var etapa=t.etapas['aprobacion'];
        if(comentario2 && comentario2.trim()) etapa.comentarios.push({autor:currentWorker().nombre, texto:comentario2.trim(), fecha:nowISO()});
        if(resultado==='rechazado'){
          etapa.estado='con_falla';
          etapa.falla={tipo:'rechazado_cliente', descripcion:comentario2||'', reportadoPor:currentWorker().nombre, fecha:nowISO(), resuelto:false};
        } else {
          etapa.estado='completado'; etapa.fin=nowISO(); etapa.encargadoId=currentWorker().id;
          if(resultado==='aprobado_obs') etapa.comentarios.push({autor:currentWorker().nombre, texto:tr('approval.obsNote'), fecha:nowISO()});
        }
      });
      return;
    }
  }

  function applyStageExtras(t, stage, fd){
    var comentario = fd.get('comentario');
    var medidas = fd.get('medidasFinales');
    var bsMedida = fd.get('backsplashMedida');
    var matSerial = fd.get('materialSerial');
    var matUbicacion = fd.get('materialUbicacion');
    if(comentario && comentario.trim()) t.etapas[stage].comentarios.push({autor:currentWorker().nombre, texto:comentario.trim(), fecha:nowISO()});
    if(medidas!==null && medidas!==undefined && medidas.trim()) t.medidasFinales = medidas.trim();
    if(bsMedida!==null && bsMedida!==undefined && bsMedida.trim()) t.backsplashMedida = bsMedida.trim();
    if(matSerial!==null && matSerial!==undefined && matSerial.trim()) t.material.serial = matSerial.trim();
    if(matUbicacion!==null && matUbicacion!==undefined && matUbicacion.trim()) t.material.ubicacion = matUbicacion.trim();
  }
  function doStageStart(el){
    var tapaId=el.getAttribute('data-tapa'), stage=el.getAttribute('data-stage');
    mutate(function(st){
      var t = st.tapas.filter(function(x){return x.id===tapaId;})[0];
      t.etapas[stage].estado='en_progreso'; t.etapas[stage].inicio=nowISO(); t.etapas[stage].encargadoId=currentWorker().id;
    });
  }
  function doStageComplete(el){
    var tapaId=el.getAttribute('data-tapa'), stage=el.getAttribute('data-stage');
    var tapa = state.tapas.filter(function(x){return x.id===tapaId;})[0];
    if(!tapa || tapa.etapas[stage].fotos.length===0){ alert(tr('stage.photoRequired')); return; }
    var formEl = el.closest('form');
    var fd = formEl ? new FormData(formEl) : null;
    mutate(function(st){
      var t = st.tapas.filter(function(x){return x.id===tapaId;})[0];
      if(fd) applyStageExtras(t, stage, fd);
      t.etapas[stage].estado='completado'; t.etapas[stage].fin=nowISO();
    });
  }
  function doStageRetry(el){
    var tapaId=el.getAttribute('data-tapa'), stage=el.getAttribute('data-stage');
    mutate(function(st){
      var t = st.tapas.filter(function(x){return x.id===tapaId;})[0];
      t.etapas[stage].estado='en_progreso';
    });
  }
  function doStageResolve(el){
    var tapaId=el.getAttribute('data-tapa'), stage=el.getAttribute('data-stage');
    var tapa = state.tapas.filter(function(x){return x.id===tapaId;})[0];
    if(!tapa || tapa.etapas[stage].fotos.length===0){ alert(tr('stage.photoRequired')); return; }
    mutate(function(st){
      var t = st.tapas.filter(function(x){return x.id===tapaId;})[0];
      if(t.etapas[stage].falla) t.etapas[stage].falla.resuelto=true;
      t.etapas[stage].estado='completado'; t.etapas[stage].fin=nowISO();
    });
  }
  function doReopenStage(el){
    var tapaId=el.getAttribute('data-tapa'), stage=el.getAttribute('data-stage');
    if(!confirm(tr('confirm.reopen'))) return;
    mutate(function(st){
      var t = st.tapas.filter(function(x){return x.id===tapaId;})[0];
      var idx = STAGES.map(function(s){return s.key;}).indexOf(stage);
      for(var i=idx;i<STAGES.length;i++){
        var k = STAGES[i].key;
        t.etapas[k] = {estado:'pendiente', encargadoId:null, inicio:null, fin:null, comentarios:t.etapas[k].comentarios, fotos:t.etapas[k].fotos};
      }
    });
  }

  /* ============ router glue ============ */
  function initialRoute(){
    if(!session) route={name:'home',params:{}};
  }
  initialRoute();

  // override render to check pin route
  var _render = render;
  render = function(){
    if(route.name==='pin' && pinTargetId){
      var app=document.getElementById('app'); app.innerHTML=screenPinEntry(pinTargetId); bindGlobalHandlers(app); renderOverlay(); return;
    }
    _render();
  };

  function renderLoading(){
    var app=document.getElementById('app');
    if(app) app.innerHTML = '<div class="center-shell"><div style="text-align:center; color:var(--text-muted); padding-top:40px;">'+esc(locale==='en'?'Loading…':'Cargando…')+'</div></div>';
  }
  renderLoading();
  loadFromServer().then(function(){
    render();
    setInterval(pollState, POLL_MS);
  });
})();
</script>
